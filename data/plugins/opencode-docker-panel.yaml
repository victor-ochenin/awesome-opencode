name: OpenCode Docker Panel
repo: https://github.com/victor-ochenin/opencodeDockerPlugin
tagline: Docker containers in the TUI sidebar, with control and logs
description: Shows every container in the session sidebar with its state, published ports and compose project. Clicking a row opens the actions docker accepts for that container's current state - start, stop, restart and compose teardown, the last one behind a confirmation - and the same window doubles as a scrollable log view.
